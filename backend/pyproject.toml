[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "billing-sim"
version = "0.1.0"
description = "Simulation of a fixed-price software engagement: billing, tickets and a client agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "anthropic>=1",
    "mcp>=1.2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["billing_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
